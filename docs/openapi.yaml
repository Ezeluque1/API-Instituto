openapi: 3.1.0

info:
  title: API Instituto
  version: 1.0.0
  description: |
    API REST del Instituto.

    ### Forma de las respuestas

    **En exito el body es el recurso pelado**, sin ningun sobre: un objeto en
    las respuestas de un recurso y un array en los listados. Un listado vacio
    devuelve `200 []`, nunca un 404. Un `DELETE` devuelve `204` sin body.

    **En error** el body es un objeto `{ success: false, message, details? }`,
    igual para todos los endpoints porque sale del manejador centralizado
    (`src/middlewares/error.middleware.js`).

    Son formas distintas a proposito: para saber si algo salio bien mirá el
    **status HTTP**, no una propiedad del body.

    Las respuestas de error estan definidas una sola vez en
    `components/responses`: no las redefinas, usalas con `$ref`.

servers:
  - url: https://api-instituto.onrender.com/api
    description: Produccion
  - url: http://localhost:3000/api
    description: Desarrollo local

# Un tag por recurso. Agrupa los endpoints en la UI y define el orden en que
# aparecen. Ejemplo:

tags:
  - name: Usuarios
    description: Autenticación, perfil y administración de usuarios

paths:

  /usuarios/registro:
    post:
      tags: [Usuarios]
      summary: Registrar un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearUsuarioInput"
      responses:
        "201":
          description: Usuario registrado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /usuarios/login:
    post:
      tags: [Usuarios]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Inicio de sesión correcto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /usuarios/logout:
    post:
      tags: [Usuarios]
      summary: Cerrar sesión
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutInput"
      responses:
        "200":
          description: Sesión cerrada correctamente
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /usuarios/recuperar-password:
    post:
      tags: [Usuarios]
      summary: Solicitar recuperación de contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecuperarPasswordInput"
      responses:
        "200":
          description: Token de recuperación generado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecuperarPasswordResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /usuarios/reset-password:
    post:
      tags: [Usuarios]
      summary: Restablecer contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Contraseña actualizada correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /usuarios/perfil:
    get:
      tags: [Usuarios]
      summary: Ver el perfil propio
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil del usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [Usuarios]
      summary: Editar el perfil propio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarPerfilInput"
      responses:
        "200":
          description: Perfil actualizado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar todos los usuarios
      description: Solo disponible para administradores.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuariosResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /usuarios/buscar:
    get:
      tags: [Usuarios]
      summary: Buscar usuarios
      description: Busca usuarios por nombre, apellido, email o DNI. Solo administradores.
      security:
        - bearerAuth: []
      parameters:
        - name: buscar
          in: query
          required: false
          schema:
            type: string
          description: Texto a buscar
      responses:
        "200":
          description: Usuarios encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuariosResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /usuarios/{id}/rol:
    patch:
      tags: [Usuarios]
      summary: Cambiar el rol de un usuario
      description: Solo disponible para administradores.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: CUID del usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambiarRolInput"
      responses:
        "200":
          description: Rol actualizado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /usuarios/{id}/desactivar:
    patch:
      tags: [Usuarios]
      summary: Desactivar un usuario
      description: Desactiva la cuenta sin eliminarla de la base de datos. Solo administradores.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: CUID del usuario
      responses:
        "200":
          description: Usuario desactivado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"



components:

  securitySchemes:
    # Es lo que valida `authenticate` en src/middlewares/auth.middleware.js.
    # Para probar endpoints protegidos desde la UI: boton "Authorize" y pegar
    # el token SIN el prefijo "Bearer " (la UI lo agrega sola).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # Los schemas de las entidades (Sede, Carrera, Usuario, Publicacion,
    # MensajeContacto) van aca, uno por recurso, a medida que se implementan.

    Error:
      type: object
      description: Forma de cualquier respuesta de error de la API.
      required: [success, message]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
          description: Descripcion del error, apta para mostrar al usuario.
          examples: ["El registro solicitado no existe"]
        details:
          description: Informacion extra. Solo aparece en algunos errores.
        stack:
          type: string
          description: >-
            Traza del error. SOLO se incluye cuando NODE_ENV=development;
            en produccion nunca se expone.

    ValidationIssue:
      type: object
      description: Un campo que no paso la validacion de Zod.
      required: [source, field, message]
      properties:
        source:
          type: string
          enum: [body, params, query]
          description: En que parte del request estaba el campo.
        field:
          type: string
          examples: [email]
        message:
          type: string
          examples: [Invalid email address]

    ValidationError:
      type: object
      description: >-
        Error 400 devuelto por el middleware `validate()`. A diferencia del
        resto, `details` trae la lista de campos que fallaron.
      required: [success, message, details]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
          examples: [Datos de entrada invalidos]
        details:
          type: array
          items:
            $ref: #/components/schemas/ValidationIssue

              Usuario:
    type: object
    properties:
      id:
        type: string
        description: CUID del usuario
      nombre:
        type: string
      apellido:
        type: string
      email:
        type: string
        format: email
      dni:
        type: string
      rol:
        type: string
        enum: [ADMIN, USUARIO]
      activo:
        type: boolean
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  CrearUsuarioInput:
    type: object
    required:
      - nombre
      - apellido
      - email
      - dni
      - password
    properties:
      nombre:
        type: string
        example: Juan
      apellido:
        type: string
        example: Perez
      email:
        type: string
        format: email
        example: juan.perez@test.com
      dni:
        type: string
        example: 40123456
      password:
        type: string
        format: password
        minLength: 8
        example: 12345678

  LoginInput:
    type: object
    required:
      - email
      - password
    properties:
      email:
        type: string
        format: email
        example: juan.perez@test.com
      password:
        type: string
        format: password
        example: 12345678

  LoginResponse:
    type: object
    properties:
      success:
        type: boolean
        example: true
      data:
        type: object
        properties:
          accessToken:
            type: string
          refreshToken:
            type: string
          usuario:
            $ref: #/components/schemas/Usuario

  LogoutInput:
    type: object
    required:
      - refreshToken
    properties:
      refreshToken:
        type: string
        description: Refresh token de la sesión

  RecuperarPasswordInput:
    type: object
    required:
      - email
    properties:
      email:
        type: string
        format: email
        example: juan.perez@test.com

  RecuperarPasswordResponse:
    type: object
    properties:
      success:
        type: boolean
        example: true
      data:
        type: object
        properties:
          message:
            type: string
            example: Token de recuperación generado
          token:
            type: string

  ResetPasswordInput:
    type: object
    required:
      - token
      - password
    properties:
      token:
        type: string
      password:
        type: string
        format: password
        minLength: 8

  ActualizarPerfilInput:
    type: object
    properties:
      nombre:
        type: string
      apellido:
        type: string
      email:
        type: string
        format: email
      dni:
        type: string

  CambiarRolInput:
    type: object
    required:
      - rol
    properties:
      rol:
        type: string
        enum: [ADMIN, USUARIO]

  UsuarioResponse:
    type: object
    properties:
      success:
        type: boolean
        example: true
      data:
        $ref: #/components/schemas/Usuario

  UsuariosResponse:
    type: object
    properties:
      success:
        type: boolean
        example: true
      data:
        type: array
        items:
          $ref: #/components/schemas/Usuario

  MessageResponse:
    type: object
    properties:
      success:
        type: boolean
        example: true
      message:
        type: string

  responses:

    # Respuestas comunes a todos los endpoints. Se referencian asi:
    #   "404": { $ref: "#/components/responses/NotFound" }

    BadRequest:
      description: Los datos enviados no pasaron la validacion.
      content:
        application/json:
          schema:
            $ref: #/components/schemas/ValidationError

    Unauthorized:
      description: Falta el token, es invalido, expiro o la cuenta esta desactivada.
      content:
        application/json:
          schema:
            $ref: #/components/schemas/Error

    Forbidden:
      description: Autenticado, pero el rol no alcanza para esta accion.
      content:
        application/json:
          schema:
            $ref: #/components/schemas/Error

    NotFound:
      description: El recurso no existe.
      content:
        application/json:
          schema:
            $ref: #/components/schemas/Error

    Conflict:
      description: >-
        Choca con un registro existente: campo unico duplicado (Prisma P2002) o
        una relacion que impide la operacion (P2003).
      content:
        application/json:
          schema:
            $ref: #/components/schemas/Error

    InternalError:
      description: Error inesperado del servidor.
      content:
        application/json:
          schema:
            $ref: #/components/schemas/Error
